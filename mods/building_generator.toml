id = "building_generator"
kind = "native-mod"
name = "Building Generator"
summary = "Noise-driven procedural architectural generator with 61 themes, 72 catalog presets, 3D hologram preview, and 30-slot materials."
description = """
**Building Generator** is an MIT-licensed procedural architecture generator for **Horizon** (Minecraft: Java Edition `26.3`, Horizon Native Mod API `0.2`).

Generate detailed multi-room houses, castles, temples, monumental landmarks, bridges, airship docks, and entire canal settlements from Russian or English text prompts, noise seeds, or the built-in 72-structure catalog.

### Key Features

- **61 Structure Themes & 72 Presets:** Pantheon, Parthenon, Colosseum, Hanging Gardens, Ishtar Gate, Mosque Palace, Angkor Temple, Water Shrine, Sphinx, Bailey Castle, City Gatehouse, Monastery, Jousting Arena, Military Outpost, Star Fort, Apothecary, Bakery/Winery, Town Hall, Opera House, Museum, Bank Vault, Academy, Galleon Ship, Shipyard, Train Station with locomotive, Airship Dock, Hydroelectric Dam, Circus Big Top, Skyscraper, Steampunk Factory, Stadium, Bunker, Spaceport Rocket, Offshore Oil Rig, Mage Tower, Hobbit Hole, Mushroom Cottage, Subterranean Mausoleum, Dwarven Hall, Dragon Sanctuary, Stonehenge Portal, Viking Longhouse, Alpine Chalet, Desert Kasbah, 9 Bridge Archetypes, and Venetian Floating Village (`FloatingVillage`).
- **Interactive GUI (`F8`):**
  - **1. Size & Area:** custom footprints up to `96×96×48`, `-Y`/`+Y` elevation nudging, interactive world corner selection (`R` rotate entrance, `PgUp`/`PgDn` height), terrain skirt & stilt adaptation over water, disk-persisted favorites (`favorites.txt`), `BG2:...` share codes, and live 3D hologram preview with vertical slicing (`[` / `]`).
  - **2. Style & Noise + Preset Catalog:** category/style/roof overrides, 5 tri-state feature toggles, seed history, quick navigation (`◀` / `▶`), and a dedicated searchable 72-preset Catalog browser.
  - **3. Materials (30 Architectural Slots):** scrollable inspector with multi-block ordered slot lists, 4 procedural mixing modes (`Patches`, `Scatter`, `Stripes`, `Checker`), and a searchable block picker (`Rec.` / `All` world blocks).
- **Commands:** `/buildgen`, `/buildgen preset <name>`, `/buildgen generate <description>`, `/buildgen size <w> <d> <h> <description>`, `/buildgen reroll`, `/buildgen undo` (up to 5 steps), `/buildgen help`.

### Permissions & Data

- Designed for Creative / operator building (world edits execute cleanly in two phases on the server side with undo history).
- Client favorites are written locally only to `horizon-mod-data/building_generator/favorites.txt`. Makes no external network requests.
"""
